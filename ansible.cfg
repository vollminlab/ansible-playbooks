[defaults]
inventory          = inventory/hosts.ini
remote_user        = vollmin
private_key_file   = ~/.ssh/ansible_k8s_ed25519
host_key_checking  = False
# `yaml` here meant community.general.yaml, which was REMOVED in
# community.general 12.0.0. On a controller with a current collection set every
# run aborts before the first task with:
#   [ERROR]: The 'community.general.yaml' callback plugin has been removed.
# The replacement is the builtin default callback with YAML result formatting,
# which is what the old plugin became upstream in ansible-core 2.13.
stdout_callback    = default
callback_result_format = yaml
retry_files_enabled = False

[ssh_connection]
ssh_args = -o IdentitiesOnly=yes -o ForwardAgent=no
pipelining = True
